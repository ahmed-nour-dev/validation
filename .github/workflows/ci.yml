name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Supported combinations live only here and in composer.json's "php"/"illuminate/validation"
# constraints — adding a new PHP or Laravel release means adding one array entry (and an
# `exclude` row if a Laravel major raises its minimum PHP version), no other restructuring.
# Anything not listed in `php` x `laravel` below is unsupported and untested; see the
# "Compatibility" section of README.md for the human-readable version of this matrix.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          # Laravel 11 and 12 require PHP >= 8.2; Laravel 13 requires PHP >= 8.3.
          - php: 8.1
            laravel: '11.*'
          - php: 8.1
            laravel: '12.*'
          - php: 8.1
            laravel: '13.*'
          - php: 8.2
            laravel: '13.*'
          # Laravel 10 predates PHP 8.4 and is not tested on it.
          - php: 8.4
            laravel: '10.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "illuminate/validation:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse -c phpstan.neon

      - name: Run full PHPUnit suite
        run: ./vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Run Laravel integration tests
        run: ./vendor/bin/phpunit --group laravel

      - name: Run native compilation tests
        run: ./vendor/bin/phpunit --group native

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Verifies the package still installs and passes on the *lowest* versions each constraint
  # in composer.json allows (php: ">=8.1", illuminate/validation: "^10.0"), catching version
  # constraints that are only accidentally satisfied by whatever composer.lock happens to pick.
  test-lowest-dependencies:
    runs-on: ubuntu-latest
    name: PHP 8.1 - Laravel 10.* (lowest dependencies)

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install lowest dependencies
        run: |
          composer require "illuminate/validation:10.*" --no-interaction --no-update
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse -c phpstan.neon

      - name: Run full PHPUnit suite
        run: ./vendor/bin/phpunit --no-coverage

  # Performance regression gate: compares ahmednour/validation against Laravel's validator (and native
  # against the engine) in the same process, so it is robust to runner speed. See benchmarks/README.md.
  performance:
    runs-on: ubuntu-latest
    name: Performance regression gate (PHP 8.3 - Laravel 11.*)

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/validation:11.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run regression gate
        run: php benchmarks/regression.php

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-regression
          path: benchmarks/results/regression.json
