version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
  # updates both the commit SHA and the "# vX.Y.Z" comment beside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Opens a PR when a new release falls outside a composer.json constraint.
  # The PR runs the full CI matrix and the security audit before it can be merged.
  # No composer.lock is committed (this is a library), so in-range releases need no PR.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer:
        patterns:
          - "*"
